name: Verify YouTube Surge module

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated v36 bundle
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- Translate.response.youtube-fix-v36.bundle.js)" ]; then
            git add Translate.response.youtube-fix-v36.bundle.js
            git commit -m "build: add generated v36 bundle"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Test request path
        run: npm run test:request
      - name: Test XML transforms
        run: npm run test:xml
      - name: Test runtime bundle
        run: |
          set -o pipefail
          npm run test:bundle 2>&1 | tee bundle-test.log
      - name: Expose runtime failure
        if: failure()
        run: |
          echo '## Runtime bundle test output' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 bundle-test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Test module independence
        run: npm run test:independence
      - name: Confirm generated bundles are committed
        run: git diff --exit-code -- request.youtube-standalone-v18.bundle.js response.youtube-standalone-v18.bundle.js Translate.response.youtube-fix-v36.bundle.js
