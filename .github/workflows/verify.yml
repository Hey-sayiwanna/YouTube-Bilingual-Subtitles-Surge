name: Verify YouTube Surge module

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test request path
        run: npm run test:request
      - name: Test XML transforms
        run: npm run test:xml
      - name: Test runtime bundle
        run: |
          set -o pipefail
          npm run test:bundle 2>&1 | tee bundle-test.log
      - name: Expose runtime failure
        if: failure()
        run: |
          echo '## Runtime bundle test output' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 bundle-test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Test module independence
        run: npm run test:independence
      - name: Test ASR segmentation
        run: npm run test:asr
      - name: Test Japanese and Korean ASR segmentation
        run: npm run test:asr-cjk
      - name: Test generic ASR segmentation
        run: npm run test:asr-generic
      - name: Confirm generated bundles are committed
        run: git diff --exit-code -- request.youtube-standalone-v18.bundle.js response.youtube-standalone-v18.bundle.js Translate.response.youtube-fix-v39-en.bundle.js Translate.response.youtube-fix-v39-cjk.bundle.js Translate.response.youtube-fix-v39-other.bundle.js
